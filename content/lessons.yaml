lessons:
  greetings:
    tibetan_title: འཚམས་འདྲི་སློབ་ཚན།
    focus: ཉིན་ལྟར་གྱི་འཚམས་འདྲི་དང་ཞེ་སའི་ཚིག
    level: འགོ་འཛུགས།
    minutes: 12
    words:
    - tibetan: བཀྲ་ཤིས་བདེ་ལེགས།
      wylie: bkra shis bde legs
      english: hello / greetings
      example: བཀྲ་ཤིས་བདེ་ལེགས། ཁྱེད་རང་བདེ་པོ་ཡིན་པས།
      example_en: Hello! How are you?
    - tibetan: ཐུགས་རྗེ་ཆེ།
      wylie: thugs rje che
      english: thank you
      example: རོགས་རམ་བྱས་པར་ཐུགས་རྗེ་ཆེ།
      example_en: Thank you for your help.
    - tibetan: དགོངས་དག
      wylie: dgongs dag
      english: sorry / excuse me
      example: དགོངས་དག ང་ཡུད་ཙམ་འགྱངས་སོང་།
      example_en: Sorry, I am a little late.
    - tibetan: ལགས་སོ།
      wylie: lags so
      english: yes (polite)
      example: ལགས་སོ། ང་འགྲོ་གི་ཡིན།
      example_en: Yes. I will go.
    - tibetan: ག་ལེར་ཕེབས།
      wylie: ga ler phebs
      english: goodbye (polite)
      example: དེ་རིང་ཚར། ག་ལེར་ཕེབས།
      example_en: That's all for today. Goodbye.
    - tibetan: ཁྱེད་རང་བདེ་པོ་ཡིན་པས།
      wylie: khyed rang bde po yin pas
      english: how are you?
      example: བཀྲ་ཤིས་བདེ་ལེགས། ཁྱེད་རང་བདེ་པོ་ཡིན་པས།
      example_en: Hello, how are you?
    dialogue:
    - speaker: A
      tibetan: བཀྲ་ཤིས་བདེ་ལེགས། ཁྱེད་རང་བདེ་པོ་ཡིན་པས།
      wylie: bkra shis bde legs. khyed rang bde po yin pas
      english: Hello! How are you?
    - speaker: B
      tibetan: བཀྲ་ཤིས་བདེ་ལེགས། ང་བདེ་པོ་ཡིན། ཁྱེད་རང་ཡང་བདེ་པོ་ཡིན་པས།
      wylie: bkra shis bde legs. nga bde po yin. khyed rang yang bde po yin pas
      english: Hello! I am fine. Are you fine too?
    - speaker: A
      tibetan: ལགས་སོ། ང་ཡང་བདེ་པོ་ཡིན། ཐུགས་རྗེ་ཆེ།
      wylie: lags so. nga yang bde po yin. thugs rje che
      english: Yes, I am fine too. Thank you.
    - speaker: B
      tibetan: དེ་རིང་སློབ་གྲྭར་འགྲོ་དགོས། ག་ལེར་ཕེབས།
      wylie: de ring slob grwar 'gro dgos. ga ler phebs
      english: I need to go to school today. Goodbye.
    - speaker: A
      tibetan: ལགས་སོ། ག་ལེར་ཕེབས།
      wylie: lags so. ga ler phebs
      english: Okay. Goodbye.
    - speaker: B
      tibetan: སང་ཉིན་མཇལ་ཡོང་།
      wylie: sang nyin mjal yong
      english: See you tomorrow.
    notes: འཚམས་འདྲིའི་སྐབས་སུ་བཀྲ་ཤིས་བདེ་ལེགས། ཞེས་པ་སྤྱིར་བཏང་གི་འབོད་སྐད་ཡིན། ཞེ་ས་སྤྱོད་ན་ཁྱེད་རང་།
      ཐུགས་རྗེ་ཆེ། ག་ལེར་ཕེབས། སོགས་བེད་སྤྱོད་བྱེད། དགོངས་དག ནི་ནོར་བ་ཡོད་ནམ་འགོར་ན་བེད་སྤྱོད་བྱེད་པའི་ཚིག་ཡིན།
      ལགས་སོ། ནི་ཞེ་སའི་འཐད་པ་སྟོན་པའི་ལན་ཡིན།
    quiz:
    - q: བཀྲ་ཤིས་བདེ་ལེགས། གི་དོན་གང་ཡིན།
      highlight: བཀྲ་ཤིས་བདེ་ལེགས།
      options:
      - hello / greetings
      - thank you
      - sorry
      - goodbye
      answer: 0
    - q: ཐུགས་རྗེ་ཆེ། གི་དོན་གང་ཡིན།
      highlight: ཐུགས་རྗེ་ཆེ།
      options:
      - please
      - thank you
      - 'yes'
      - school
      answer: 1
    - q: ཕྱིར་ལོག་སྐབས་ཞེ་སའི་ཚིག་གང་ཡིན།
      highlight: ''
      options:
      - ག་ལེར་ཕེབས།
      - ཨ་མ
      - ཆུ
      - གཅིག
      answer: 0
  family:
    tibetan_title: ཁྱིམ་ཚང་གི་མིང་ཚིག
    focus: ཁྱིམ་མི་དང་གྲོགས་པོའི་མིང་ཚིག
    level: འགོ་འཛུགས།
    minutes: 12
    words:
    - tibetan: ཨ་མ
      wylie: a ma
      english: mother
      example: ངའི་ཨ་མ་སློབ་གྲྭར་ཡོང་གི་རེད།
      example_en: My mother is coming to school.
    - tibetan: ཨ་པ
      wylie: a pa
      english: father
      example: ངའི་ཨ་པ་ལས་ཀ་ལ་ཕེབས་སོང་།
      example_en: My father went to work.
    - tibetan: སྤུན
      wylie: spun
      english: sibling
      example: ང་ལ་སྤུན་གཉིས་ཡོད།
      example_en: I have two siblings.
    - tibetan: གྲོགས་པོ
      wylie: grogs po
      english: friend
      example: ངའི་གྲོགས་པོ་སློབ་གྲྭར་ཡོད།
      example_en: My friend is at school.
    - tibetan: དགེ་རྒན
      wylie: dge rgan
      english: teacher
      example: དགེ་རྒན་ལགས་བཀྲ་ཤིས་བདེ་ལེགས།
      example_en: Hello, teacher.
    - tibetan: བུ་མོ
      wylie: bu mo
      english: girl / daughter
      example: བུ་མོ་དེ་དེབ་ཀློག་གི་འདུག
      example_en: That girl is reading a book.
    dialogue:
    - speaker: A
      tibetan: ཁྱེད་རང་གི་ཁྱིམ་མི་ག་ཚོད་ཡོད།
      wylie: khyed rang gi khyim mi ga tshod yod
      english: How many people are in your family?
    - speaker: B
      tibetan: ང་ལ་ཨ་མ་དང་ཨ་པ། སྤུན་གཅིག་ཡོད།
      wylie: nga la a ma dang a pa. spun gcig yod
      english: I have a mother, a father, and one sibling.
    - speaker: A
      tibetan: ཁྱེད་རང་གི་གྲོགས་པོ་ག་པར་ཡོད།
      wylie: khyed rang gi grogs po ga par yod
      english: Where is your friend?
    - speaker: B
      tibetan: ངའི་གྲོགས་པོ་སློབ་གྲྭར་ཡོད། དགེ་རྒན་དང་མཉམ་དུ་ཡོད།
      wylie: nga'i grogs po slob grwar yod. dge rgan dang mnyam du yod
      english: My friend is at school, with the teacher.
    - speaker: A
      tibetan: ཨ་མ་ལ་ཐུགས་རྗེ་ཆེ་ཞུ་རོགས།
      wylie: a ma la thugs rje che zhu rogs
      english: Please say thank you to your mother.
    - speaker: B
      tibetan: ལགས་སོ། ང་ཨ་མ་ལ་བཤད་ཀྱི་ཡིན།
      wylie: lags so. nga a ma la bshad kyi yin
      english: Okay. I will tell my mother.
    notes: ཁྱིམ་ཚང་གི་མིང་ཚིག་ནང་ཨ་མ་དང་ཨ་པ་ནི་ཕ་མ་ཡིན། སྤུན་ནི་ཕུ་ནུ་མོ་སྤུན་མཆེད་ལ་གོ། གྲོགས་པོ་ནི་མཛའ་གྲོགས་ཡིན།
      དགེ་རྒན་ནི་སློབ་གྲྭའི་དགེ་རྒན་ལ་ཞེ་ས་སྤྱོད་སྐབས་བེད་སྤྱོད་བྱེད། ང་ལ་…ཡོད། ཞེས་པས་རང་ལ་ཡོད་པ་སྟོན།
    quiz:
    - q: ཨ་མ གི་དོན་གང་ཡིན།
      highlight: ཨ་མ
      options:
      - father
      - mother
      - friend
      - teacher
      answer: 1
    - q: དགེ་རྒན གི་དོན་གང་ཡིན།
      highlight: དགེ་རྒན
      options:
      - student
      - sibling
      - teacher
      - girl
      answer: 2
    - q: ངའི་______་སློབ་གྲྭར་ཡོད། (friend)
      highlight: ''
      options:
      - གྲོགས་པོ
      - ཆུ
      - ཉི་མ
      - གསུམ
      answer: 0
  school:
    tibetan_title: སློབ་གྲྭའི་མིང་ཚིག
    focus: སློབ་གྲྭ་དང་སློབ་སྦྱོང་གི་མིང་ཚིག
    level: འགོ་འཛུགས།
    minutes: 12
    words:
    - tibetan: སློབ་གྲྭ
      wylie: slob grwa
      english: school
      example: ང་སློབ་གྲྭར་འགྲོ་གི་ཡིན།
      example_en: I am going to school.
    - tibetan: དེབ
      wylie: deb
      english: book
      example: འདི་ངའི་དེབ་ཡིན།
      example_en: This is my book.
    - tibetan: སྨྱུག་གུ
      wylie: smyug gu
      english: pen
      example: སྨྱུག་གུ་ག་པར་ཡོད།
      example_en: Where is the pen?
    - tibetan: ཤོག་བུ
      wylie: shog bu
      english: paper
      example: ཤོག་བུ་གཅིག་སྤྲོད་རོགས།
      example_en: Please give me one paper.
    - tibetan: སློབ་ཕྲུག
      wylie: slob phrug
      english: student
      example: ང་སློབ་ཕྲུག་ཡིན།
      example_en: I am a student.
    - tibetan: དྲི་བ
      wylie: dri ba
      english: question
      example: ང་ལ་དྲི་བ་གཅིག་ཡོད།
      example_en: I have one question.
    dialogue:
    - speaker: A
      tibetan: ཁྱེད་རང་གི་དེབ་ག་པར་ཡོད།
      wylie: khyed rang gi deb ga par yod
      english: Where is your book?
    - speaker: B
      tibetan: ངའི་དེབ་འདིར་ཡོད། སྨྱུག་གུ་ཡང་ཡོད།
      wylie: nga'i deb 'dir yod. smyug gu yang yod
      english: My book is here. I also have a pen.
    - speaker: A
      tibetan: ཤོག་བུ་གཅིག་སྤྲོད་ཐུབ་བམ།
      wylie: shog bu gcig sprod thub bam
      english: Can you give me one paper?
    - speaker: B
      tibetan: ལགས་སོ། འདི་ཡིན།
      wylie: lags so. 'di yin
      english: Yes. Here it is.
    - speaker: A
      tibetan: ཐུགས་རྗེ་ཆེ། ང་སློབ་ཕྲུག་ཡིན། དྲི་བ་གཅིག་ཡོད།
      wylie: thugs rje che. nga slob phrug yin. dri ba gcig yod
      english: Thank you. I am a student. I have a question.
    - speaker: B
      tibetan: དྲི་བ་དྲིས་ཆོག ང་རོགས་བྱེད་ཀྱི་ཡིན།
      wylie: dri ba dris chog. nga rogs byed kyi yin
      english: You may ask. I will help.
    notes: སློབ་གྲྭ་ནི་སློབ་སྦྱོང་བྱེད་སའི་ས་གནས་ཡིན། དེབ་དང་སྨྱུག་གུ། ཤོག་བུ་ནི་སློབ་ཁྲིད་ཀྱི་ཡོ་བྱད་གཙོ་བོ་ཡིན།
